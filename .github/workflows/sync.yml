name: Scheduled Sync & Health Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force full sync"
        type: boolean
        default: false

jobs:
  sync:
    name: Trigger Data Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check configuration
        id: check-config
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ DEPLOY_URL belum dikonfigurasi pada Repository Variables. Melewati sinkronisasi."
          elif [ -z "$ADMIN_SECRET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ ADMIN_SECRET belum dikonfigurasi pada Repository Secrets. Melewati sinkronisasi."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger sync endpoint
        if: steps.check-config.outputs.skip != 'true'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          echo "🔄 Memicu sinkronisasi data InfoCVE..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST "${DEPLOY_URL}/api/sync" \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"force\": ${{ github.event.inputs.force_sync || 'false' }}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "$BODY" | head -20

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Sinkronisasi gagal dengan kode HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Sinkronisasi berhasil diselesaikan"

      - name: Health check
        if: steps.check-config.outputs.skip != 'true'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          echo "🏥 Menjalankan pengecekan kesehatan server..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" "${DEPLOY_URL}/api/health")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "$BODY" | head -10

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Pemeriksaan kesehatan gagal"
            exit 1
          fi

          echo "✅ Aplikasi dalam kondisi sehat"
